  <rect x="16" y="34" width="38" height="20" rx="5" fill="url(#clip)"/>
  <rect x="58" y="34" width="18" height="20" rx="5" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="80" y="34" width="32" height="20" rx="5" fill="url(#clip)"/>
  <path d="M64 58 V70" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  <rect x="26" y="76" width="38" height="20" rx="5" fill="url(#clip)"/>
  <rect x="66" y="76" width="32" height="20" rx="5" fill="url(#clip)"/>
  <rect x="26" y="100" width="72" height="8" rx="4" fill="#ffffff" fill-opacity="0.85"/>
